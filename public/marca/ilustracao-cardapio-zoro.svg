<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 360" role="img" aria-label="O cardápio do Zoro">
  <defs>
    <clipPath id="folha">
      <rect x="20" y="20" width="392" height="318" rx="20"/>
    </clipPath>
  </defs>

  <!-- sombra + folha -->
  <rect x="26" y="28" width="392" height="318" rx="20" fill="#2b1b12" opacity="0.14"/>
  <rect x="20" y="20" width="392" height="318" rx="20" fill="#ffffff" stroke="#e7d4a8" stroke-width="2"/>

  <g clip-path="url(#folha)">
    <!-- cabeçalho: a paisagem do Zoro -->
    <rect x="20" y="20" width="392" height="120" fill="#f5e2b8"/>
    <circle cx="356" cy="58" r="16" fill="#f2a81d"/>
    <!-- torre da Matriz -->
    <rect x="198" y="72" width="26" height="66" fill="#2b1b12"/>
    <path d="M195 72 L211 50 L227 72 Z" fill="#2b1b12"/>
    <rect x="209" y="38" width="4" height="14" fill="#2b1b12"/>
    <rect x="204" y="42" width="14" height="4" fill="#2b1b12"/>
    <circle cx="211" cy="96" r="4.5" fill="#f5e2b8"/>
    <!-- morros -->
    <path d="M20 140 C 80 108 140 128 210 116 C 280 104 350 130 412 112 L412 140 Z" fill="#2e9e5b" opacity="0.55"/>
    <path d="M20 140 C 90 122 150 138 230 126 C 300 116 360 138 412 128 L412 140 Z" fill="#1e7a46"/>
  </g>

  <!-- título -->
  <text x="216" y="176" text-anchor="middle" font-family="'Darker Grotesque','Arial Black',sans-serif" font-weight="800" font-size="30" fill="#2b1b12">O cardápio do Zoro</text>
  <line x1="44" y1="192" x2="388" y2="192" stroke="#e7d4a8" stroke-width="2"/>

  <!-- linhas do cardápio: cada item é um lugar da cidade -->
  <g>
