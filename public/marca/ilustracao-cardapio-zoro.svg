    <g transform="translate(56 226)">
      <path d="M0 0 C -7 -9 -7 -16 0 -22 C 7 -16 7 -9 0 0 Z" fill="#d62d20"/>
      <circle cx="0" cy="-14" r="3.2" fill="#fff"/>
    </g>
    <rect x="74" y="216" width="120" height="12" rx="6" fill="#efe3c4"/>
    <line x1="206" y1="222" x2="346" y2="222" stroke="#d9c290" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
    <rect x="352" y="214" width="36" height="15" rx="5" fill="#d62d20"/>

    <!-- linha 2 -->
    <g transform="translate(56 262)">
      <path d="M0 0 C -7 -9 -7 -16 0 -22 C 7 -16 7 -9 0 0 Z" fill="#1e7a46"/>
      <circle cx="0" cy="-14" r="3.2" fill="#fff"/>
    </g>
    <rect x="74" y="252" width="150" height="12" rx="6" fill="#efe3c4"/>
    <line x1="236" y1="258" x2="346" y2="258" stroke="#d9c290" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
    <rect x="352" y="250" width="36" height="15" rx="5" fill="#1e7a46"/>

    <!-- linha 3 -->
    <g transform="translate(56 298)">
      <path d="M0 0 C -7 -9 -7 -16 0 -22 C 7 -16 7 -9 0 0 Z" fill="#f2a81d"/>
      <circle cx="0" cy="-14" r="3.2" fill="#fff"/>
    </g>
    <rect x="74" y="288" width="96" height="12" rx="6" fill="#efe3c4"/>
    <line x1="182" y1="294" x2="346" y2="294" stroke="#d9c290" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
    <rect x="352" y="286" width="36" height="15" rx="5" fill="#f2a81d"/>

    <!-- linha 4 -->
    <g transform="translate(56 334)">
      <path d="M0 0 C -7 -9 -7 -16 0 -22 C 7 -16 7 -9 0 0 Z" fill="#d62d20"/>
      <circle cx="0" cy="-14" r="3.2" fill="#fff"/>
    </g>
    <rect x="74" y="324" width="132" height="12" rx="6" fill="#efe3c4"/>
    <line x1="218" y1="330" x2="346" y2="330" stroke="#d9c290" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
    <rect x="352" y="322" width="36" height="15" rx="5" fill="#d62d20"/>
  </g>
