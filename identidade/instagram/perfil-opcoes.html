<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Darker+Grotesque:wght@800;900&display=swap" rel="stylesheet" />
<style>
  :root{--tinta:#2b1b12;--brasa:#d62d20;--pequi:#f2a81d;--creme:#f9efd6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#ccc}
  .opt{width:1080px;height:1080px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;overflow:hidden;position:relative;font-weight:900}
  .cour{font-family:"Courier Prime",monospace;font-weight:700}
  .dg{font-family:"Darker Grotesque",sans-serif;font-weight:900;letter-spacing:-0.05em}

  /* P1 rz. no vermelho */
  .p1{background:var(--brasa)}
  .p1 .m{font-size:620px;line-height:1;transform:translateY(-4%)}
  .p1 .r{color:var(--creme)}.p1 .z{color:var(--tinta)}.p1 .d{color:var(--pequi)}

  /* P2 cupom RZ escuro (atual) */
  .p2{background:var(--tinta)}
  .p2 .rule{font-size:64px;letter-spacing:14px;color:var(--pequi);line-height:1}
  .p2 .m{font-size:320px;line-height:1.08;color:var(--creme)}
  .p2 .m .z{color:var(--brasa)}
  .p2 .sub{font-size:32px;letter-spacing:14px;color:var(--creme);opacity:.8;margin-top:26px}

  /* P3 cupom RZ vermelho */
  .p3{background:var(--brasa)}
  .p3 .rule{font-size:64px;letter-spacing:14px;color:var(--creme);line-height:1}
  .p3 .m{font-size:320px;line-height:1.08;color:var(--creme)}
  .p3 .m .z{color:var(--tinta)}
  .p3 .sub{font-size:32px;letter-spacing:14px;color:var(--creme);opacity:.85;margin-top:26px}

  /* P4 carimbo rz. no vermelho */
  .p4{background:var(--brasa)}
  .p4 .ring{position:absolute;inset:76px;border:16px dashed var(--creme);border-radius:50%;opacity:.9}
  .p4 .m{font-size:440px;line-height:1;transform:translateY(-3%)}
  .p4 .r{color:var(--creme)}.p4 .z{color:var(--tinta)}.p4 .d{color:var(--pequi)}
  .p4 .sub{font-family:"Courier Prime",monospace;font-weight:700;font-size:40px;letter-spacing:12px;color:var(--creme);margin-top:10px}

  /* P5 nome empilhado cupom */
  .p5{background:var(--tinta)}
  .p5 .rule{font-size:52px;letter-spacing:12px;color:var(--pequi);line-height:1}
  .p5 .n{font-family:"Courier Prime",monospace;font-weight:700;font-size:150px;letter-spacing:8px;line-height:1.15;color:var(--creme)}
  .p5 .n .z{color:var(--brasa)}
  .p5 .sub{font-family:"Courier Prime",monospace;font-weight:700;font-size:30px;letter-spacing:12px;color:var(--creme);opacity:.75;margin-top:22px}

  /* P6 rz. no creme */
  .p6{background:var(--creme)}
  .p6 .m{font-size:620px;line-height:1;transform:translateY(-4%)}
  .p6 .r{color:var(--tinta)}.p6 .z{color:var(--brasa)}.p6 .d{color:var(--pequi)}
</style>
</head>
<body>

<div class="opt p1" data-name="perfil-1"><span class="dg m"><span class="r">r</span><span class="z">z</span><span class="d">.</span></span></div>

<div class="opt p2" data-name="perfil-2">
  <div class="cour rule">==============</div>
  <div class="dg m">R<span class="z">Z</span></div>
  <div class="cour rule">==============</div>
  <div class="cour sub">DELIVERY&nbsp;&middot;&nbsp;ZORO-MG</div>
</div>

<div class="opt p3" data-name="perfil-3">
  <div class="cour rule">==============</div>
  <div class="dg m">R<span class="z">Z</span></div>
  <div class="cour rule">==============</div>
  <div class="cour sub">DELIVERY&nbsp;&middot;&nbsp;ZORO-MG</div>
</div>

<div class="opt p4" data-name="perfil-4">
  <div class="ring"></div>
  <span class="dg m"><span class="r">r</span><span class="z">z</span><span class="d">.</span></span>
  <div class="sub">ZORO&nbsp;&middot;&nbsp;MG</div>
</div>

<div class="opt p5" data-name="perfil-5">
  <div class="cour rule">===============</div>
  <div class="n">RANGO<br><span class="z">ZORO</span></div>
  <div class="cour rule">===============</div>
  <div class="cour sub">DELIVERY&nbsp;&middot;&nbsp;ZORO-MG</div>
</div>

<div class="opt p6" data-name="perfil-6"><span class="dg m"><span class="r">r</span><span class="z">z</span><span class="d">.</span></span></div>

</body>
</html>
